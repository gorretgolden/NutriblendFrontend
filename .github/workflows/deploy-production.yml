name: 🚀 Deploy to Production (cPanel)

on:
  # Manual trigger only for production
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📚 Install Dependencies
        run: npm ci

      - name: 🔧 Create Production Environment File
        run: |
          echo "NEXT_PUBLIC_API_URL=${{ secrets.PRODUCTION_API_URL }}" > .env.production
          echo "NEXT_PUBLIC_ASSET_URL=${{ secrets.PRODUCTION_ASSET_URL }}" >> .env.production

      - name: 🏗️ Build Next.js (Static Export)
        run: npm run build
        env:
          NODE_ENV: production

      - name: 📤 Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_FRONTEND_DIR }}
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: ✅ Deployment Complete
        run: |
          echo "🎉 Production deployment successful!"
          echo "🌐 Visit your site at: ${{ secrets.PRODUCTION_URL }}"
